<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PollVibe - סקר בחירות בלייב</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0f172a; color: white; height: 100vh; overflow: hidden; }

        /* תצוגת נייד (תלמיד) */
        #student-view { display: none; height: 100vh; padding: 15px; flex-direction: column; overflow-y: auto; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
        .party-card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 20px 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; text-align: center; color: #f8fafc; transition: all 0.2s; cursor: pointer; min-height: 80px; }
        .party-card:active { transform: scale(0.96); background: #2563eb; }

        /* פופ-אפ אישור */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin: 8px; font-size: 1rem; }
        .btn-confirm { background: #22c55e; color: white; }
        .btn-cancel { background: #ef4444; color: white; }

        /* תצוגת מנהל */
        #admin-view { display: none; height: 100vh; flex-direction: column; justify-content: space-between; padding: 30px; text-align: center; }
        .status-badge { font-size: 1.5rem; background: #334155; padding: 10px 25px; border-radius: 50px; display: inline-block; margin: 0 auto; }
        
        /* קופסת קלפי ואנימציית מעטפות */
        .box-container { position: relative; width: 300px; height: 250px; margin: 0 auto; }
        .ballot-box { width: 100%; height: 180px; background: #2563eb; border-radius: 20px; position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid #60a5fa; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .vote-count { font-size: 4rem; font-weight: 900; color: #fff; }
        
        .envelope { position: absolute; width: 45px; height: 30px; background: #fef08a; border: 2px solid #ca8a04; border-radius: 4px; top: -40px; z-index: 10; animation: dropEnvelope 1.2s ease-in forwards; }
        @keyframes dropEnvelope {
            0% { top: -40px; opacity: 1; transform: rotate(0deg); }
            100% { top: 120px; opacity: 0; transform: rotate(15deg) scale(0.5); }
        }

        .timer-display { font-size: 3rem; color: #ef4444; font-weight: bold; height: 60px; }
        .admin-actions { display: flex; justify-content: center; gap: 20px; }
        .admin-btn { padding: 15px 30px; font-size: 1.2rem; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        .admin-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-start { background: #22c55e; color: white; }
        .btn-stop { background: #eab308; color: black; }
        .btn-reset { background: #ef4444; color: white; }

        /* מסך תוצאות - תיקון יישור העמודות בגרף */
        #results-screen { display: none; height: 100vh; padding: 30px 20px; flex-direction: column; align-items: center; }
        .chart-container { display: flex; align-items: flex-end; gap: 12px; height: 70%; width: 95%; border-bottom: 4px solid #475569; padding-bottom: 0px; }
        .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
        
        /* מכולה ייעודית לעמודה המאפשרת יישור תחתון מושלם */
        .bar-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        .bar { width: 100%; background: #3b82f6; border-radius: 6px 6px 0 0; transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1); height: 0%; min-height: 4px; }
        
        /* קיבוע גובה התוויות למניעת תזוזת הקו התחתון */
        .bar-label { height: 50px; margin-top: 8px; font-size: 0.85rem; text-align: center; font-weight: bold; display: flex; align-items: flex-start; justify-content: center; line-height: 1.2; word-break: break-word; width: 100%; }
        .bar-val { font-size: 1.1rem; margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- מסך תלמיד -->
    <div id="student-view">
        <div class="grid-container" id="parties-grid"></div>
    </div>

    <!-- פופ אפ אישור תלמיד -->
    <div class="modal" id="confirm-modal">
        <div class="modal-content">
            <h3>אישור הצבעה</h3>
            <p id="modal-text" style="margin: 15px 0; font-size: 1.2rem;"></p>
            <button class="btn btn-confirm" onclick="submitVote()">אישור והצבעה</button>
            <button class="btn btn-cancel" onclick="closeModal()">שינוי בחירה</button>
        </div>
    </div>

    <!-- מסך מנהל -->
    <div id="admin-view">
        <div class="status-badge" id="status-text">מצב הצבעה: סגור</div>
        
        <div class="box-container" id="box-container">
            <div class="ballot-box">
                <div style="font-size: 1.1rem; opacity: 0.8;">סה"כ מצביעים</div>
                <div class="vote-count" id="vote-count">0</div>
            </div>
        </div>

        <div class="timer-display" id="timer-display"></div>

        <div class="admin-actions">
            <button class="admin-btn btn-start" id="toggle-btn" onclick="toggleVoting()">התחל הצבעה</button>
            <button class="admin-btn btn-reset" onclick="resetVoting()">איפוס הצבעה</button>
            <button class="admin-btn" id="reveal-btn" style="background: #a855f7; color: white;" onclick="showResults()" disabled>חשוף תוצאות</button>
        </div>
    </div>

    <!-- מסך תוצאות -->
    <div id="results-screen">
        <h1 style="font-size: 2.2rem; margin-bottom: 15px;">תוצאות הבחירות</h1>
        <div class="chart-container" id="chart-container"></div>
        <button class="admin-btn btn-reset" style="margin-top: 25px;" onclick="location.reload()">חזרה למנהל</button>
    </div>

    <script>
        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
        
        let deviceId = localStorage.getItem('poll_device_id') || 'dev_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('poll_device_id', deviceId);

        let selectedParty = null;
        let isAdmin = location.pathname.includes('/admin-control-x9z87');
        let currentStatus = 'closed';
        let partiesData = [];
        let votesData = {};

        if (isAdmin) {
            document.getElementById('admin-view').style.display = 'flex';
        } else {
            document.getElementById('student-view').style.display = 'flex';
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'INIT') {
                partiesData = data.parties;
                votesData = data.state.votes || {};
                currentStatus = data.state.status;
                
                if (!isAdmin) renderStudentGrid();
                updateAdminUI(data.state.totalVotes);
            }

            if (data.type === 'NEW_VOTE') {
                votesData[data.party] = (votesData[data.party] || 0) + 1;
                if (isAdmin) {
                    document.getElementById('vote-count').innerText = data.totalVotes;
                    spawnEnvelope();
                }
            }

            if (data.type === 'STATUS_CHANGE') {
                currentStatus = data.status;
                if (isAdmin) updateAdminUI();
            }

            if (data.type === 'START_COUNTDOWN') {
                document.getElementById('timer-display').innerText = "10";
            }

            if (data.type === 'TIMER_TICK') {
                document.getElementById('timer-display').innerText = data.timer > 0 ? data.timer : "";
            }

            if (data.type === 'VOTE_SUCCESS') {
                document.getElementById('student-view').innerHTML = `<h1 style="text-align:center; margin-top:40vh; color:#22c55e;">תודתך נקלטה!<br>הצבעת ל-${data.party}</h1>`;
            }

            if (data.type === 'RESET_ALL') {
                location.reload();
            }

            if (data.type === 'ERROR') {
                alert(data.message);
            }
        };

        function renderStudentGrid() {
            const grid = document.getElementById('parties-grid');
            grid.innerHTML = '';
            partiesData.forEach(party => {
                const card = document.createElement('div');
                card.className = 'party-card';
                card.innerText = party;
                card.onclick = () => openModal(party);
                grid.appendChild(card);
            });
        }

        function openModal(party) {
            selectedParty = party;
            document.getElementById('modal-text').innerText = `האם אתה בטוח שברצונך להצביע ל-${party}?`;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        function submitVote() {
            closeModal();
            ws.send(JSON.stringify({ type: 'VOTE', party: selectedParty, deviceId }));
        }

        function updateAdminUI(total) {
            const btn = document.getElementById('toggle-btn');
            const statusText = document.getElementById('status-text');
            const revealBtn = document.getElementById('reveal-btn');

            if (currentStatus === 'closed') {
                statusText.innerText = "מצב הצבעה: סגור";
                btn.innerText = "התחל הצבעה";
                btn.className = "admin-btn btn-start";
                revealBtn.disabled = false;
            } else if (currentStatus === 'voting') {
                statusText.innerText = "מצב הצבעה: אוסף קולות...";
                btn.innerText = "עצור הצבעה";
                btn.className = "admin-btn btn-stop";
                revealBtn.disabled = true;
            } else if (currentStatus === 'stopping') {
                statusText.innerText = "מצב הצבעה: נעצר...";
                revealBtn.disabled = true;
            }
        }

        function toggleVoting() {
            if (currentStatus === 'closed') {
                ws.send(JSON.stringify({ type: 'ADMIN_ACTION', action: 'START' }));
            } else if (currentStatus === 'voting') {
                ws.send(JSON.stringify({ type: 'ADMIN_ACTION', action: 'STOP' }));
            }
        }

        function resetVoting() {
            if (confirm("האם אתה בטוח שברצונך למחוק את כל הקולות?")) {
                ws.send(JSON.stringify({ type: 'ADMIN_ACTION', action: 'RESET' }));
            }
        }

        function spawnEnvelope() {
            const container = document.getElementById('box-container');
            const env = document.createElement('div');
            env.className = 'envelope';
            env.style.left = Math.random() * (container.clientWidth - 50) + 'px';
            container.appendChild(env);
            setTimeout(() => env.remove(), 1200);
        }

        function showResults() {
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('results-screen').style.display = 'flex';

            const container = document.getElementById('chart-container');
            container.innerHTML = '';

            let maxVotes = Math.max(...Object.values(votesData), 1);

            partiesData.forEach(party => {
                const count = votesData[party] || 0;
                const pct = (count / maxVotes) * 100;

                const group = document.createElement('div');
                group.className = 'bar-group';
                group.innerHTML = `
                    <div class="bar-val">${count}</div>
                    <div class="bar-wrapper">
                        <div class="bar" style="height: 0%" id="bar-${encodeURIComponent(party)}"></div>
                    </div>
                    <div class="bar-label">${party}</div>
                `;
                container.appendChild(group);

                setTimeout(() => {
                    const el = document.getElementById(`bar-${encodeURIComponent(party)}`);
                    if (el) el.style.height = pct + '%';
                }, 200);
            });
        }
    </script>
</body>
</html>
